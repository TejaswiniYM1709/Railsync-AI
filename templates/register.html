<!DOCTYPE html>
<html>
<head>
    <title>RailSync | Register</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background: #f1f5f9; color: #142b45; }
        header { background: #142b45; color: white; padding: 18px 7%; }
        header a { color: white; text-decoration: none; }
        .box { max-width: 460px; margin: 50px auto; background: white; padding: 34px; border-radius: 12px; box-shadow: 0 4px 16px #d8dee6; }
        h1 { margin-top: 0; color: #2878b5; }
        label { display: block; margin-top: 14px; font-weight: bold; }
        input { width: 100%; box-sizing: border-box; padding: 11px; margin-top: 5px; border: 1px solid #cbd5e1; border-radius: 6px; }
        button { width: 100%; margin-top: 22px; padding: 12px; background: #2878b5; color: white; border: 0; border-radius: 6px; font-size: 16px; cursor: pointer; }
        .message { margin-top: 14px; color: #b91c1c; font-weight: bold; }
        p { text-align: center; }
        a { color: #2878b5; }
    </style>
</head>
<body>
<header><a href="/">🚆 RailSync</a></header>
<div class="box">
    <h1>Create your account</h1>
    <form method="POST" action="{{ url_for('auth.register') }}">
        <label for="full_name">Full name</label>
        <input id="full_name" name="full_name" required>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>

        <label for="phone">Phone (optional)</label>
        <input id="phone" name="phone" inputmode="numeric">

        <label for="password">Password</label>
        <input id="password" name="password" type="password" minlength="6" required>

        <label for="confirm_password">Confirm password</label>
        <input id="confirm_password" name="confirm_password" type="password" minlength="6" required>

        <button type="submit">Register →</button>
    </form>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <p class="message">{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <p>Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
</div>
</body>
</html>
