<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Schedule - RailSync</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #243b55;
            min-height: 100vh;
        }

        header {
            background: #17365d;
            color: white;
            padding: 20px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            font-size: 25px;
        }

        header a {
            color: white;
            text-decoration: none;
            background: #ffffff20;
            padding: 10px 18px;
            border-radius: 8px;
        }

        .container {
            max-width: 650px;
            margin: 45px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 5px 25px #17365d12;
        }

        h1 {
            color: #17365d;
            font-size: 27px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #8492a6;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin: 20px 0 8px;
            font-weight: bold;
            color: #334e68;
        }

        input, select {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5deea;
            border-radius: 8px;
            font-size: 15px;
            background: #fbfcfe;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #2878c8;
            box-shadow: 0 0 0 3px #2878c820;
        }

        button {
            width: 100%;
            margin-top: 28px;
            padding: 14px;
            background: #1769aa;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #124d80;
        }

        .back {
            display: inline-block;
            margin-top: 22px;
            color: #1769aa;
            text-decoration: none;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #8492a6;
            font-size: 13px;
        }
    </style>
</head>

<body>

<header>
    <h2>🚆 RailSync Admin</h2>
    <a href="{{ url_for('auth.logout') }}">Logout</a>
</header>

<div class="container">

    <div class="card">

        <h1>📅 Add New Schedule</h1>
        <p class="subtitle">
            Create a train journey schedule by selecting a train and journey date.
        </p>

        <form method="POST">

            <label>Select Train</label>
            <select name="train_id" required>
                <option value="">Choose Train</option>
                {% for train in trains %}
                    <option value="{{ train.train_id }}">
                        {{ train.train_number }} - {{ train.train_name }}
                    </option>
                {% endfor %}
            </select>

            <label>Journey Date</label>
            <input type="date" name="journey_date" required>

            <button type="submit">Add Schedule →</button>

        </form>

        <a class="back" href="/admin/schedules">
            ← Back to Schedule Management
        </a>

    </div>

</div>

<footer>
    © 2026 RailSync | Smart Railway Management System
</footer>

</body>
</html>
