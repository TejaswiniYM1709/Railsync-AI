<!DOCTYPE html>
<html>
<head>
    <title>Edit Route - RailSync</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5fa;
            padding: 30px;
        }

        .container {
            background: white;
            padding: 25px;
            max-width: 500px;
            margin: auto;
            border-radius: 8px;
        }

        h1 { color: #17365d; }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            margin-top: 20px;
            padding: 12px;
            background: #17365d;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Edit Route</h1>
    <p>Update railway route details.</p>

    <form method="POST">

        <label>Route Name</label>
        <input type="text" name="route_name"
               value="{{ route.route_name }}"
               maxlength="150" required>

        <label>Source Station</label>
        <select name="source_station_id" required>
            {% for station in stations %}
                <option value="{{ station.station_id }}"
                    {% if station.station_id == route.source_station_id %}selected{% endif %}>
                    {{ station.station_name }}
                </option>
            {% endfor %}
        </select>

        <label>Destination Station</label>
        <select name="destination_station_id" required>
            {% for station in stations %}
                <option value="{{ station.station_id }}"
                    {% if station.station_id == route.destination_station_id %}selected{% endif %}>
                    {{ station.station_name }}
                </option>
            {% endfor %}
        </select>

        <label>Distance (KM)</label>
        <input type="number" name="distance_km"
               value="{{ route.distance_km }}"
               step="0.01" min="0.01" required>

        <button type="submit">Update Route</button>

    </form>

    <br>
    <a href="/admin/routes">← Back to Route Management</a>

</div>

</body>
</html>
